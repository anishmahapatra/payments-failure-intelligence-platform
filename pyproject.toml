[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "payments-failure-intelligence-platform"
version = "0.1.0"
description = "Production-style ML platform for payment failure intelligence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<3.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "sqlalchemy>=2.0.31,<3.0.0",
  "psycopg[binary]>=3.2.0,<4.0.0",
  "redis>=5.0.7,<6.0.0",
  "httpx>=0.27.0,<1.0.0",
  "prometheus-client>=0.20.0,<1.0.0",
  "python-json-logger>=2.0.7,<3.0.0",
  "pandas>=2.2.2,<3.0.0",
  "numpy>=2.0.1,<3.0.0",
  "scikit-learn>=1.5.1,<2.0.0",
  "xgboost>=2.1.1,<3.0.0",
  "mlflow>=2.15.1,<3.0.0",
  "joblib>=1.4.2,<2.0.0",
  "pyarrow>=17.0.0,<18.0.0",
  "feast>=0.40.0,<1.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2,<9.0.0",
  "pytest-cov>=5.0.0,<6.0.0",
  "ruff>=0.5.7,<1.0.0",
]

[tool.setuptools.packages.find]
include = ["app*", "training*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

